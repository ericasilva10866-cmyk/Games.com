<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha — Ganha Sem Parar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        #placa {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        canvas {
            background: #222;
            border: 4px solid #4CAF50;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(76,175,80,0.3);
        }
        .controles {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background: #333;
            border: 2px solid #4CAF50;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
        }
        .btn:active { background: #4CAF50; transform: scale(0.95); }
        .btn-cima { grid-column: 2; }
        .btn-esq { grid-column: 1; grid-row: 2; }
        .btn-dir { grid-column: 3; grid-row: 2; }
        .btn-baixo { grid-column: 2; grid-row: 2; margin-top: 80px; }
    </style>
</head>
<body>
    <!-- CÓDIGO DO ANÚNCIO — NÃO APAGAR! -->
    <script src="https://api.crazygames.com/v2/crazygames-sdk.js"></script>
    
    <div id="placa">Pontos: 0</div>
    <canvas id="jogo" width="300" height="300"></canvas>
    
    <div class="controles">
        <div class="btn btn-cima" id="btn-cima">↑</div>
        <div class="btn btn-esq" id="btn-esq">←</div>
        <div class="btn-dir" id="btn-dir">→</div>
        <div class="btn-baixo" id="btn-baixo">↓</div>
    </div>

<script>
const canvas = document.getElementById("jogo");
const pincel = canvas.getContext("2d");
const placaTxt = document.getElementById("placa");
const tamanho = 15;

let cobra = [
    {x: 105, y: 150},
    {x: 120, y: 150},
    {x: 150, y: 150}
];
let direcao = {x: tamanho, y: 0};
let comida = novaComida();
let pontos = 0;
let velocidade = 120;
let jogoRodando = true;

function novaComida() {
    return {
        x: Math.floor(Math.random() * (canvas.width / tamanho)) * tamanho,
        y: Math.floor(Math.random() * (canvas.height / tamanho)) * tamanho
    };
}

function desenhar() {
    pincel.fillStyle = "#222";
    pincel.fillRect(0, 0, canvas.width, canvas.height);
    
    pincel.fillStyle = "#ff4444";
    pincel.fillRect(comida.x, comida.y, tamanho - 2, tamanho - 2);
    
    pincel.fillStyle = "#4CAF50";
    cobra.forEach(parte => {
        pincel.fillRect(parte.x, parte.y, tamanho - 2, tamanho - 2);
    });
}

async function mostrarAnuncioEContinuar() {
    if (!window.CrazyGames) return true;
    try {
        // Mostra o anúncio sem perder os pontos!
        await window.CrazyGames.ad.showAd("midgame");
    } catch (e) {
        console.log("Anúncio indisponível, seguindo o jogo");
    }
    return true;
}

async function bateru() {
    jogoRodando = false;
    await mostrarAnuncioEContinuar(); // MOSTRA ANÚNCIO AQUI 💰
    // CONTINUA COM OS PONTOS! NÃO ZERA! ✅
    cobra = [
        {x: 105, y: 150},
        {x: 120, y: 150},
        {x: 150, y: 150}
    ];
    direcao = {x: tamanho, y: 0};
    comida = novaComida();
    jogoRodando = true;
}

function mover() {
    if (!jogoRodando) return;
    
    const cabeca = {
        x: cobra[cobra.length - 1].x + direcao.x,
        y: cobra[cobra.length - 1].y + direcao.y
    };
    
    // BATEU NA PAREDE → MOSTRA ANÚNCIO E CONTINUA 💰
    if (cabeca.x < 0 || cabeca.x >= canvas.width || cabeca.y < 0 || cabeca.y >= canvas.height) {
        bateru();
        return;
    }
    
    // BATEU EM SI MESMA → MOSTRA ANÚNCIO E CONTINUA 💰
    for (let i = 0; i < cobra.length; i++) {
        if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) {
            bateru();
            return;
        }
    }
    
    cobra.push(cabeca);
    
    if (cabeca.x === comida.x && cabeca.y === comida.y) {
        pontos++;
        placaTxt.innerText = "Pontos: " + pontos;
        comida = novaComida();
    } else {
        cobra.shift();
    }
}

function loop() {
    mover();
    desenhar();
    setTimeout(loop, velocidade);
}

document.addEventListener("keydown", (e) => {
    if (!jogoRodando) return;
    if (e.key === "ArrowUp" && direcao.y === 0) direcao = {x: 0, y: -tamanho};
    else if (e.key === "ArrowDown" && direcao.y === 0) direcao = {x: 0, y: tamanho};
    else if (e.key === "ArrowLeft" && direcao.x === 0) direcao = {x: -tamanho, y: 0};
    else if (e.key === "ArrowRight" && direcao.x === 0) direcao = {x: tamanho, y: 0};
});

document.getElementById("btn-cima").addEventListener("click", () => {
    if (direcao.y === 0) direcao = {x: 0, y: -tamanho};
});
document.getElementById("btn-baixo").addEventListener("click", () => {
    if (direcao.y === 0) direcao = {x: 0, y: tamanho};
});
document.getElementById("btn-esq").addEventListener("click", () => {
    if (direcao.x === 0) direcao = {x: -tamanho, y: 0};
});
document.getElementById("btn-dir").addEventListener("click", () => {
    if (direcao.x === 0) direcao = {x: tamanho, y: 0};
});

// Inicia o jogo
loop();
</script>
</body>
</html>
