<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha — Ganha Sem Parar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        #placa {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        canvas {
            background: #222;
            border: 4px solid #4CAF50;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(76,175,80,0.3);
        }
        .controles {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background: #333;
            border: 2px solid #4CAF50;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
        }
        .btn:active { background: #4CAF50; transform: scale(0.95); }
        .btn-cima { grid-column: 2; }
        .btn-esq { grid-column: 1; grid-row: 2; }
        .btn-dir { grid-column: 3; grid-row: 2; }
        .btn-baixo { grid-column: 2; grid-row: 2; margin-top: 80px; }
// Saiu pela esquerda → aparece na direita
if (cabeca.x < 0) cabeca.x = larguraTela - tamanho;
// Saiu pela direita → aparece na esquerda
if (cabeca.x >= larguraTela) cabeca.x = 0;
// Saiu por cima → aparece embaixo
if (cabeca.y < 0) cabeca.y = alturaTela - tamanho;
// Saiu por baixo → aparece em cima
if (cabeca.y >= alturaTela) cabeca.y = 0;
