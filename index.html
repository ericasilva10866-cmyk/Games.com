

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Royale 👑</title>
    
    <!-- 🔌 PASSO 1: SCRIPT OFICIAL DA CRAZYGAMES (Obrigatório para os anúncios funcionarem) -->
    <script src="https://crazygames.com"></script>

    <style>
        /* Estilo visual Retro Neon que cansa menos a vista e atrai cliques */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
            margin-bottom: 5px;
        }
        #placar {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #recorde {
            font-size: 18px;
            color: #ffcc00;
            margin-bottom: 15px;
        }
        canvas {
            border: 4px solid #00ff66;
            box-shadow: 0 0 20px #00ff66;
            background-color: #1a1a1a;
        }
        .controles-mobile {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background-color: #222;
            border: 2px solid #00ff66;
            color: #00ff66;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 5px #00ff66;
        }
        .btn:active {
            background-color: #00ff66;
            color: #000;
        }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>Neon Snake Royale 👑</h1>
    <div id="placar">Pontos: <span id="pontos-valor">0</span></div>
    <div id="recorde">Recorde: <span id="recorde-valor">0</span></div>

    <!-- Tela do Jogo -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Controles para Celular (Mobile-Friendly para ganhar mais acessos) -->
    <div class="controles-mobile">
        <button class="btn" id="btn-up" onclick="mudarDirecao('CIMA')">↑</button>
        <button class="btn" id="btn-left" onclick="mudarDirecao('ESQUERDA')">←</button>
        <button class="btn" id="btn-down" onclick="mudarDirecao('BAIXO')">↓</button>
        <button class="btn" id="btn-right" onclick="mudarDirecao('DIREITA')">→</button>
    </div>

    <script>
        // Inicialização do SDK da CrazyGames
        let crazyGameSDK = null;
        if (window.CrazyGames && window.CrazyGames.SDK) {
            crazyGameSDK = window.CrazyGames.SDK;
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tamanhoBloco = 20;
        const totalBlocos = canvas.width / tamanhoBloco;

        let cobra = [{ x: 10, y: 10 }];
        let comida = { x: 15, y: 15 };
        let dx = 1;
        let dy = 0;
        let pontos = 0;
        let jogoAtivo = true;
        let velocidade = 150; // Tempo inicial em milissegundos
        let loopJogo;

        // Recupera o recorde salvo localmente (Lógica de ADS)
        let recordeSalvo = localStorage.getItem("snake_high_score") || 0;
        document.getElementById("recorde-valor").innerText = recordeSalvo;

        function iniciarLoop() {
            loopJogo = setTimeout(onTick, velocidade);
        }

        function onTick() {
            if (!jogoAtivo) return;
            limparTela();
            desenharComida();
            moverCobra();
            desenharCobra();
            checarColisao();
            iniciarLoop();
        }

        function limparTela() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function desenharCobra() {
            ctx.fillStyle = "#00ff66"; // Corpo Neon
            cobra.forEach((pedaco, index) => {
                // Cabeça com cor ligeiramente diferente
                if(index === 0) ctx.fillStyle = "#00b347";
                else ctx.fillStyle = "#00ff66";
                
                ctx.fillRect(pedaco.x * tamanhoBloco, pedaco.y * tamanhoBloco, tamanhoBloco - 2, tamanhoBloco - 2);
            });
        }

        function moverCobra() {
            const cabeca = { x: cobra[0].x + dx, y: cobra[0].y + dy };
            cobra.unshift(cabeca);

            // Se comeu a comida
            if (cabeca.x === comida.x && cabeca.y === comida.y) {
                pontos += 10;
                document.getElementById("pontos-valor").innerText = pontos;
                
                // REGRA DA EVOLUÇÃO PROGRESSIVA: Fica mais rápido a cada 30 pontos
                if (pontos % 30 === 0) {
                    velocidade = Math.max(60, velocidade - 15);
                }
                
                gerarComidaAleaotria();
            } else {
                cobra.pop();
            }
        }

        function gerarComidaAleaotria() {
            comida.x = Math.floor(Math.random() * totalBlocos);
            comida.y = Math.floor(Math.random() * totalBlocos);
        }

        function desenharComida() {
            ctx.fillStyle = "#ff0055"; // Comida vermelha vibrante
            ctx.fillRect(comida.x * tamanhoBloco, comida.y * tamanhoBloco, tamanhoBloco - 2, tamanhoBloco - 2);
        }

        function mudarDirecao(direcao) {
            if (direcao === 'ESQUERDA' && dx !== 1) { dx = -1; dy = 0; }
            if (direcao === 'CIMA' && dy !== 1) { dx = 0; dy = -1; }
            if (direcao === 'DIREITA' && dx !== -1) { dx = 1; dy = 0; }
            if (direcao === 'BAIXO' && dy !== -1) { dx = 0; dy = 1; }
        }

        // Aceitar também setas do teclado do Computador (Regra técnica de usabilidade)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") mudarDirecao('ESQUERDA');
            if (e.key === "ArrowUp") mudarDirecao('CIMA');
            if (e.key === "ArrowRight") mudarDirecao('DIREITA');
            if (e.key === "ArrowDown") mudarDirecao('BAIXO');
        });

        function checarColisao() {
            const cabeca = cobra[0];

            // Bateu nas paredes do Canvas
            const colidiuParede = cabeca.x < 0 || cabeca.x >= totalBlocos || cabeca.y < 0 || cabeca.y >= totalBlocos;
            
            // Bateu no próprio corpo
            let colidiuCorpo = false;
            for (let i = 1; i < cobra.length; i++) {
                if (cobra[i].x === cabeca.x && cobra[i].y === cabeca.y) colidiuCorpo = true;
            }

            if (colidiuParede || colidiuCorpo) {
                gameOver();
            }
        }

        // 🔌 PASSO 2: A FUNÇÃO DE GAME OVER QUE CHAMA O ANÚNCIO
        function gameOver() {
            jogoAtivo = false;
            clearTimeout(loopJogo);

            // Verifica e salva o recorde no navegador
            if (pontos > recordeSalvo) {
                recordeSalvo = pontos;
                localStorage.setItem("snake_high_score", recordeSalvo);
                document.getElementById("recorde-valor").innerText = recordeSalvo;
            }

            // Se o jogo estiver rodando dentro do portal da CrazyGames, solicita o anúncio comercial
            if (crazyGameSDK) {
                console.log("Solicitando anúncio de tela cheia...");
                crazyGameSDK.ad.requestAd("midgame", {
                    adStarted: () => {
                        console.log("Anúncio iniciado.");
                        // Aqui você pausaria músicas de fundo do jogo se tivesse
                    },
                    adFinished: () => {
                        console.log("Anúncio finalizado.");
                        reiniciarJogo();
                    },
                    adError: (error) => {
                        console.error("Erro no anúncio ou AdBlock ativo:", error);
                        reiniciarJogo();
                    }
                });
            } else {
                // Se estiver testando localmente no seu computador sem estar no site deles, reinicia direto
                alert("Fim de Jogo! Pontos: " + pontos);
                reiniciarJogo();
            }
        }

        function reiniciarJogo() {
            cobra = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            pontos = 0;
            velocidade = 150;
            document.getElementById("pontos-valor").innerText = pontos;
            gerarComidaAleaotria();
            jogoAtivo = true;
            iniciarLoop();
        }

        // Inicia o jogo pela primeira vez
        gerarComidaAleaotria();
        iniciarLoop();
    </script>
</body>
</html>
